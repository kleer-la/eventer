# Brakeman: static security analysis for Rails. Fails on any warning that is
# not in config/brakeman.ignore, and uploads the results to GitHub code scanning.
# Uses the Brakeman version in Gemfile.lock, so CI and `bundle exec brakeman`
# report the same thing (#237).
name: Brakeman Scan

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  brakeman-scan:
    name: Brakeman Scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.9
      # Brakeman parses the source and needs none of the app's gems (rmagick
      # needs ImageMagick headers); same version as Gemfile.lock.
      - name: Install Brakeman
        run: gem install brakeman --no-document -v "$(grep -oP '^    brakeman \(\K[^)]+' Gemfile.lock)"
      - name: Scan
        run: brakeman --no-pager -o /dev/stdout -o brakeman.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: brakeman.sarif
