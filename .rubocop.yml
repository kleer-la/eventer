AllCops:
  NewCops: disable
  Exclude:
    - 'bin/**/*'
    - 'db/migrate/201*'
    - 'db/schema.rb'

Metrics/BlockLength:
  AllowedMethods:
    - 'describe'
    - 'context'
    - 'arguments' # an MCP tool's argument declarations: a schema, one line per field
  Exclude:
    - 'spec/factories.rb'
    - 'config/routes.rb'
    - 'config/initializers/doorkeeper.rb' # one configure block, a DSL like routes.rb


Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Exclude:
    - 'db/migrate/*.*'

Metrics/AbcSize:
  Max: 20 # was 17

Style/MixinUsage: 
  Exclude:
    - 'spec/**/*'

# An MCP tool is one class per entity, and its `call` takes one keyword per
# declared argument: the size follows the schema, not the design.
Metrics/ClassLength:
  Exclude:
    - 'app/tools/*.rb'
Metrics/ParameterLists:
  Exclude:
    - 'app/tools/*.rb'
