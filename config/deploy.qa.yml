proxy:
  hosts:
    - qa.eventos.kleer.la
    - qa.handoff.kleer.la # session-handoff accounts (#203); DNS A record → this server
  ssl: true
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    WEB_CONCURRENCY: 1
    # Where MCP articles copy_from_production reads from (#216); only QA has it.
    PRODUCTION_API_URL: https://eventos.kleer.la
